<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Dropdown - json-renderers-specs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <!-- Top bar -->
  <header class="navbar navbar-expand navbar-dark bg-dark py-2 px-3 shadow-sm mb-4">
    <div class="container-fluid max-w-lg">
      <a class="navbar-brand fs-6 fw-bold text-white d-flex align-items-center" href="../index.html">
        <i class="bi bi-arrow-left me-2 text-warning"></i>
        <span>json-renderers-specs</span>
      </a>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-success font-monospace">select</span>
        <a href="https://github.com/keshavsoft/json-renderers-specs" target="_blank" class="text-light text-decoration-none">
          <i class="bi bi-github fs-5"></i>
        </a>
      </div>
    </div>
  </header>

  <main class="container py-2" style="max-width: 650px;">
    <!-- Clean Header Card -->
    <div class="d-flex justify-content-between align-items-baseline mb-3">
      <div>
        <h1 class="h4 fw-bold mb-1 text-dark">Declarative Select Dropdown</h1>
        <p class="text-muted small mb-0">Compiled from <code>docs/common/data.json</code> and <code>columns.json</code>.</p>
      </div>
      <a href="../index.html" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-grid me-1"></i>All Components
      </a>
    </div>

    <!-- Live Render Container -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <label for="category" class="form-label fw-semibold text-secondary small">Choose Category:</label>
        <div id="dom-render-container">
          <div class="text-center py-4 text-muted">
            <div class="spinner-border spinner-border-sm text-success me-2" role="status"></div>
            Building select specification...
          </div>
        </div>
      </div>
    </div>

    <!-- Collapsible Headless Spec Inspector -->
    <div class="card shadow-sm border-0">
      <div class="card-body p-3">
        <details>
          <summary class="fw-semibold text-secondary small" style="cursor: pointer;">
            <i class="bi bi-code-slash text-success me-1"></i>View Generated Headless Spec JSON
          </summary>
          <pre id="spec-output" class="bg-dark text-light p-3 rounded mt-3 small mb-0 overflow-auto" style="max-height: 350px;"><code>Loading spec...</code></pre>
        </details>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
